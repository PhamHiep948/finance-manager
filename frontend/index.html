<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HandmadeFinance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=35" />
</head>
<body class="login-mode">
  <div id="login-root"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <i data-lucide="wallet"></i>
      </span>
      <div>
        <strong>HandmadeFinance</strong>
        <small>Quản lý thu – chi</small>
      </div>
    </div>
    <nav class="nav" id="main-nav"></nav>
    <div class="sidebar-foot" id="side-foot"></div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <div class="workspace" id="workspace">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu"><i data-lucide="menu"></i></button>
        <div class="crumb" id="topbar-title">Dashboard <span class="crumb-sep">›</span> <b>Tổng quan tài chính</b></div>
      </div>
      <div class="topbar-right">
        <button class="icon-ghost" type="button" aria-label="Thông báo">
          <i data-lucide="bell"></i>
          <span class="bell-dot"></span>
        </button>
        <div class="user-menu">
          <button class="user-btn" id="user-btn" type="button">
            <span class="user-meta">
              <strong id="top-name">—</strong>
              <small id="top-role">—</small>
            </span>
            <span class="avatar" id="top-avatar">A</span>
          </button>
          <div class="dropdown" id="user-dd">
            <button type="button" data-go="profile">Hồ sơ cá nhân</button>
            <button type="button" id="logout-dd">Đăng xuất</button>
          </div>
        </div>
      </div>
    </header>
    <section class="page" id="view"></section>
  </div>

  <div class="modal-back" id="modal-back">
    <div class="modal">
      <h3 id="modal-title">Xác nhận</h3>
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button class="btn secondary" id="modal-cancel">Hủy</button>
        <button class="btn danger" id="modal-ok">Xóa</button>
      </div>
    </div>
  </div>
  <div class="modal-back" id="user-modal">
    <div class="form-window user-window">
      <div class="form-window-head">
        <div>
          <div class="exp-kicker" id="user-modal-kicker"></div>
          <h2 id="user-modal-title">Thêm người dùng</h2>
          <p class="muted" id="user-modal-sub">Tạo tài khoản mới với tên, email và mật khẩu.</p>
        </div>
        <button class="icon-ghost" type="button" id="user-modal-close" aria-label="Đóng"><i data-lucide="x"></i></button>
      </div>
      <form id="add-user-form" class="form-window-body">
        <div class="form-grid">
          <label class="field span-2"><span>Tên hiển thị <span class="req">*</span></span><input name="name" required placeholder="Nguyễn Văn A" /></label>
          <label class="field span-2"><span>Tài khoản (email) <span class="req">*</span></span><input name="email" type="email" required placeholder="user@demo.local" /></label>
          <label class="field span-2"><span>Mật khẩu <span class="req" id="user-pw-req">*</span></span>
            <div class="pw-wrap">
              <input name="password" id="new-user-pw" type="password" minlength="4" placeholder="Nhập mật khẩu" />
              <button type="button" class="pw-toggle" id="new-user-pw-toggle">Hiện</button>
            </div>
            <small class="muted" id="user-pw-hint">Tối thiểu 4 ký tự.</small>
          </label>
          <label class="field"><span>Vai trò</span>
            <select name="role">
              <option value="VIEWER">Người xem</option>
              <option value="EMPLOYEE">Nhân viên</option>
              <option value="SHOP_OWNER">Chủ shop</option>
              <option value="ADMIN">Quản trị viên</option>
            </select>
          </label>
          <label class="field"><span>Trạng thái</span>
            <select name="status">
              <option value="active">Đang hoạt động</option>
              <option value="disabled">Ngừng kích hoạt</option>
            </select>
          </label>
        </div>
        <div class="form-actions">
          <button class="btn secondary" type="button" id="user-modal-cancel">Hủy</button>
          <button class="btn primary" type="submit" id="user-modal-submit">Thêm người dùng</button>
        </div>
      </form>
    </div>
  </div>
  <div class="modal-back" id="cols-modal">
    <div class="modal cols-modal">
      <h3 id="cols-modal-title">Cột hiển thị</h3>
      <p>Tick cột muốn giữ trên bảng. Bỏ tick để ẩn tạm.</p>
      <div class="col-picker-actions">
        <button class="btn ghost" type="button" id="cols-all">Chọn tất cả</button>
        <button class="btn ghost" type="button" id="cols-none">Bỏ chọn</button>
      </div>
      <div id="cols-modal-list" class="col-picker"></div>
      <div class="modal-actions">
        <button class="btn ghost" type="button" id="cols-reset">Mặc định</button>
        <button class="btn secondary" type="button" id="cols-cancel">Hủy</button>
        <button class="btn primary" type="button" id="cols-apply">Áp dụng</button>
      </div>
    </div>
  </div>
  <div class="modal-back" id="expense-detail-modal">
    <div class="exp-modal" id="expense-detail-body"></div>
  </div>
  <div class="modal-back" id="record-form-modal">
    <div class="form-window">
      <div class="form-window-head">
        <div>
          <div class="exp-kicker" id="record-form-kicker"></div>
          <h2 id="record-form-title">Thêm khoản</h2>
          <p class="muted" id="record-form-sub"></p>
        </div>
        <button class="icon-ghost" type="button" id="record-form-close" aria-label="Đóng"><i data-lucide="x"></i></button>
      </div>
      <div class="form-window-body" id="record-form-body"></div>
    </div>
  </div>
  <div class="toast-wrap" id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="js/data.js?v=20"></script>
  <script src="js/auth.js?v=13"></script>
  <script src="js/ui-mock.js?v=25"></script>
  <script src="js/app.js?v=32"></script>
  <script src="js/views.js?v=33"></script>
</body>
</html>
