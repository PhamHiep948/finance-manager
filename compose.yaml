services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: handmade_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - handmade_finance_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d handmade_finance"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  handmade_finance_postgres:
